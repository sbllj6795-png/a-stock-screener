[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "a-stock-screener"
version = "0.1.0"
description = "A-share stock screener with backtesting (East Money / gm SDK)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gm>=3.0.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]

[project.scripts]
a-stock-web = "stock_toolkit.web.app:main"
a-stock-screen = "stock_toolkit.cli:run_screen"
a-stock-backtest = "stock_toolkit.cli:run_backtest"

[tool.setuptools.packages.find]
where = ["src"]
