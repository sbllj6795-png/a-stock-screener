name: 低估值大盘股示例
trade_date: null  # null = 最近交易日

universe:
  type: index_constituents
  index: SHSE.000300

filters:
  - metric: pe_ttm
    op: between
    min: 5
    max: 25
  - metric: tot_mv
    op: gte
    value: 50000000000  # 总市值 >= 500 亿（元）
  - metric: turnrate
    op: gte
    value: 0.3

technical:
  - type: close_above_ma
    window: 20

sort_by:
  field: pe_ttm
  ascending: true

limit: 30
